name: Update insider data

on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insider-update
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll EDGAR and rebuild the site data
        env:
          INSIDER_UA: ${{ secrets.INSIDER_UA }}
        run: |
          if [ -z "$INSIDER_UA" ]; then
            echo "::error::Missing INSIDER_UA. Create a repository secret named INSIDER_UA with a real SEC User-Agent such as 'Your Name your@email.com'."
            exit 1
          fi

          if python3 insider_cluster.py validate-db; then
            echo "Valid production database found; backfilling the latest 4 days."
            BACKFILL_DAYS=4
          else
            echo "No valid production database found; removing any stale/demo database and seeding 30 days."
            rm -f insider.db
            BACKFILL_DAYS=30
          fi

          python3 insider_cluster.py backfill --days "$BACKFILL_DAYS"
          python3 insider_cluster.py prices --window 30 --min-insiders 3
          python3 insider_cluster.py export --window 30 --min-insiders 3
          python3 insider_cluster.py validate-db
          python3 insider_cluster.py validate-json --path data.json

      - name: Commit if anything changed
        run: |
          git config user.name  "insider-radar-bot"
          git config user.email "actions@github.com"
          git add -A insider.db data.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
