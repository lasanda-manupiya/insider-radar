name: Update insider data

on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insider-update
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll EDGAR and rebuild the site data
        env:
          INSIDER_UA: ${{ secrets.INSIDER_UA }}
        run: |
          if [ -z "$INSIDER_UA" ]; then
            echo "::error::Set the INSIDER_UA secret to 'Your Name your@email.com'."
            exit 1
          fi
          python3 insider_cluster.py backfill --days 4
          python3 insider_cluster.py prices --window 30 --min-insiders 3
          python3 insider_cluster.py export --window 30 --min-insiders 3

      - name: Commit if anything changed
        run: |
          git config user.name  "insider-radar-bot"
          git config user.email "actions@github.com"
          git add -A insider.db data.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
